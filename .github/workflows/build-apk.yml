name: Build Vayu AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true

      - name: Check Flutter
        run: flutter --version

      - name: Get Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze Flutter project
        working-directory: mobile
        run: flutter analyze

      - name: Build release APK
        working-directory: mobile
        run: flutter build apk --release

      - name: Rename APK
        run: |
          mkdir -p release
          cp mobile/build/app/outputs/flutter-apk/app-release.apk release/vayu-ai-0.0.1.apk

      - name: Upload Vayu APK
        uses: actions/upload-artifact@v4
        with:
          name: vayu-ai-0.0.1-apk
          path: release/vayu-ai-0.0.1.apk
          retention-days: 30
